databases:
  - name: codequest-db
    databaseName: codequest
    user: codequest
    plan: free

services:
  - type: web
    name: codequest-backend
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn myproject.wsgi:application --bind 0.0.0.0:$PORT"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: codequest-db
          property: connectionString

  - type: web
    name: codequest-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: codequest-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
